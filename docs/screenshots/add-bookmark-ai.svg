<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 740" width="1280" height="740" fill="none">
  <defs>
    <linearGradient id="am-cover" x1="0" y1="0" x2="500" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0EA5E9" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <filter id="modal-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0F172A" flood-opacity="0.28" />
    </filter>
    <clipPath id="am-clip">
      <rect x="0" y="0" width="1280" height="740" rx="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#am-clip)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <!-- Softly Dimmed Background Workspace -->
    <rect x="0" y="0" width="1280" height="740" fill="#F1F3F6" />
    <rect x="0" y="0" width="256" height="740" fill="#E8EBF0" />
    <rect x="280" y="88" width="300" height="250" rx="10" fill="#FFFFFF" opacity="0.65" />
    <rect x="604" y="88" width="300" height="250" rx="10" fill="#FFFFFF" opacity="0.65" />
    <rect x="928" y="88" width="300" height="250" rx="10" fill="#FFFFFF" opacity="0.65" />
    <rect x="280" y="362" width="300" height="250" rx="10" fill="#FFFFFF" opacity="0.65" />
    <rect x="604" y="362" width="300" height="250" rx="10" fill="#FFFFFF" opacity="0.65" />
    <rect x="928" y="362" width="300" height="250" rx="10" fill="#FFFFFF" opacity="0.65" />

    <!-- Backdrop Scrim -->
    <rect x="0" y="0" width="1280" height="740" fill="#0F172A" fill-opacity="0.42" />

    <!-- Centered Add Bookmark Modal -->
    <g transform="translate(366, 46)" filter="url(#modal-shadow)">
      <rect width="548" height="648" rx="12" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="1" />

      <!-- Header -->
      <text x="22" y="36" fill="#181A1F" font-size="15.5" font-weight="700">Добавить закладку</text>
      <rect x="190" y="16" width="164" height="28" rx="6" fill="#F4F5F7" />
      <rect x="193" y="19" width="90" height="22" rx="4.5" fill="#FFFFFF" />
      <text x="238" y="34" text-anchor="middle" fill="#181A1F" font-size="12" font-weight="600">Одна ссылка</text>
      <text x="318" y="34" text-anchor="middle" fill="#5F6672" font-size="12">Список</text>
      <text x="520" y="36" text-anchor="middle" fill="#8B929E" font-size="16">✕</text>
      <line x1="0" y1="56" x2="548" y2="56" stroke="#E6E8EC" stroke-width="1" />

      <!-- URL Row -->
      <text x="22" y="82" fill="#5F6672" font-size="12" font-weight="500">URL страницы</text>
      <text x="526" y="82" text-anchor="end" fill="#0B72E7" font-size="12" font-weight="600">✦ Заполнить с ИИ</text>

      <rect x="22" y="90" width="390" height="38" rx="8" fill="#FFFFFF" stroke="#0B72E7" stroke-width="1.5" />
      <text x="34" y="114" fill="#181A1F" font-size="13.5">https://docs.docker.com/compose/</text>
      <rect x="422" y="90" width="104" height="38" rx="8" fill="#FFFFFF" stroke="#D4DCE6" stroke-width="1" />
      <text x="474" y="114" text-anchor="middle" fill="#2C313A" font-size="13" font-weight="500">Загрузить</text>
      <text x="22" y="144" fill="#5F6672" font-size="11.5">Ссылка вставлена из буфера обмена</text>
      <text x="526" y="144" text-anchor="end" fill="#0B72E7" font-size="11.5">Очистить</text>

      <!-- Cover Preview -->
      <rect x="22" y="156" width="504" height="106" rx="9" fill="url(#am-cover)" />
      <rect x="44" y="176" width="84" height="66" rx="8" fill="#FFFFFF" fill-opacity="0.18" />
      <text x="148" y="204" fill="#FFFFFF" font-size="22" font-weight="700">Docker Compose</text>
      <text x="148" y="226" fill="#DBEAFE" font-size="13">Define and run multi-container applications</text>

      <!-- Title -->
      <text x="22" y="286" fill="#5F6672" font-size="12" font-weight="500">Название</text>
      <rect x="22" y="294" width="504" height="36" rx="8" fill="#F6F7F9" stroke="#E2E5EB" />
      <text x="34" y="317" fill="#181A1F" font-size="13.5">Docker Compose overview — Docker Docs</text>

      <!-- Description -->
      <text x="22" y="352" fill="#5F6672" font-size="12" font-weight="500">Описание</text>
      <text x="526" y="352" text-anchor="end" fill="#5F6672" font-size="11.5">✦ Составить ИИ</text>
      <rect x="22" y="360" width="504" height="56" rx="8" fill="#F6F7F9" stroke="#E2E5EB" />
      <text x="34" y="382" fill="#181A1F" font-size="13">Официальная документация по описанию и запуску</text>
      <text x="34" y="401" fill="#181A1F" font-size="13">многоконтейнерных приложений через файл compose.yml.</text>

      <!-- Collection -->
      <text x="22" y="438" fill="#5F6672" font-size="12" font-weight="500">Коллекция</text>
      <text x="526" y="438" text-anchor="end" fill="#5F6672" font-size="11.5">✦ Подобрать ИИ</text>
      <rect x="22" y="446" width="504" height="36" rx="8" fill="#F6F7F9" stroke="#E2E5EB" />
      <text x="34" y="469" fill="#181A1F" font-size="13">Self-Hosted и Docker</text>
      <text x="510" y="469" text-anchor="end" fill="#8B929E" font-size="12">▾</text>

      <!-- Tags + AI Suggest -->
      <text x="22" y="504" fill="#5F6672" font-size="12" font-weight="500">Теги (через запятую)</text>
      <rect x="22" y="512" width="368" height="36" rx="8" fill="#F6F7F9" stroke="#E2E5EB" />
      <text x="34" y="535" fill="#181A1F" font-size="13">docker, homelab, devops</text>
      <rect x="398" y="512" width="128" height="36" rx="8" fill="#FFFFFF" stroke="#D4DCE6" />
      <text x="462" y="535" text-anchor="middle" fill="#2C313A" font-size="12.5" font-weight="500">✦ Получить теги</text>
      <text x="22" y="564" fill="#5F6672" font-size="11.5">Подобрано ИИ: описание · коллекция «Self-Hosted и Docker» · из ваших: #docker, #homelab</text>

      <!-- Footer -->
      <line x1="22" y1="580" x2="526" y2="580" stroke="#ECEEF2" stroke-width="1" />

      <rect x="22" y="594" width="15" height="15" rx="3.5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.4" />
      <text x="45" y="606" fill="#5F6672" font-size="12.5">Добавить в избранное</text>

      <rect x="22" y="618" width="15" height="15" rx="3.5" fill="#0B72E7" />
      <path d="M25.5 625.5L28.3 628.3L33.5 622.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
      <text x="45" y="630" fill="#181A1F" font-size="12.5" font-weight="500">Сохранить PDF-снимок для чтения оффлайн</text>

      <rect x="344" y="598" width="76" height="36" rx="8" fill="#F4F5F7" />
      <text x="382" y="621" text-anchor="middle" fill="#5F6672" font-size="13" font-weight="500">Отмена</text>
      <rect x="428" y="598" width="98" height="36" rx="8" fill="#0B72E7" />
      <text x="477" y="621" text-anchor="middle" fill="#FFFFFF" font-size="13" font-weight="600">+ Сохранить</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="739" rx="12" stroke="#DCE0E6" stroke-width="1" />
</svg>
