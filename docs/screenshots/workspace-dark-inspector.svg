      <text x="14" y="401" fill="#58A6FF" font-size="12.5" font-weight="600">✦ Краткая выжимка (TL;DR)</text>
      <text x="14" y="424" fill="#E2E8F0" font-size="12">• Профили позволяют включать опциональные</text>
      <text x="24" y="440" fill="#E2E8F0" font-size="12">сервисы (например, Chromium) одной флагом.</text>
      <text x="14" y="464" fill="#E2E8F0" font-size="12">• Именованные тома изолируют данные SQLite</text>
